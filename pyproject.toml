[project]
name = "agentic-game24"
version = "1.0.0"
description = "A reproducible CoT-style vs Tree-of-Thought Game of 24 benchmark"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["game24*", "ta2*", "core*", "final_jury*", "benchmarks*"]
exclude = ["ta1*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_ta2"]
